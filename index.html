<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Meter Digit Editor</title>
<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100%;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(59, 130, 246, 0.22),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(139, 92, 246, 0.20),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #111827,
            #1e293b
        );

    color: #f8fafc;

    touch-action:
        pan-x
        pan-y
        pinch-zoom;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    width: calc(100% - 30px);

    max-width: 1100px;

    margin: 25px auto;

    padding: 25px;

    background:
        rgba(255, 255, 255, 0.08);

    border:
        1px solid
        rgba(255, 255, 255, 0.12);

    border-radius: 22px;

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
}


/* =====================================================
   TITLE
===================================================== */

h1 {

    text-align: center;

    margin:
        0 0 25px 0;

    font-size: 30px;

    font-weight: 700;

    letter-spacing: 0.5px;

    background:
        linear-gradient(
            90deg,
            #60a5fa,
            #a78bfa,
            #22d3ee
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color:
        transparent;
}


/* =====================================================
   METER BUTTON AREA
===================================================== */

.meter-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

    margin-bottom: 22px;

    padding: 15px;

    background:
        rgba(0, 0, 0, 0.18);

    border-radius: 15px;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);
}


/* =====================================================
   METER BUTTONS
===================================================== */

.meter-buttons button {

    min-width: 42px;

    padding:
        9px 13px;

    border: none;

    border-radius: 10px;

    color: #ffffff;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #334155,
            #1e293b
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.12);

    box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.25);

    transition:
        all 0.2s ease;
}


.meter-buttons button:hover {

    transform:
        translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #6366f1
        );

    box-shadow:
        0 7px 18px
        rgba(59, 130, 246, 0.35);
}


.meter-buttons button:active {

    transform:
        scale(0.94);
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 10px;

    margin-bottom: 22px;

    padding: 15px;

    background:
        rgba(0, 0, 0, 0.18);

    border-radius: 15px;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);
}


/* =====================================================
   INPUT
===================================================== */

.controls input[type="text"] {

    width: 190px;

    padding:
        11px 14px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    outline: none;

    background:
        rgba(255, 255, 255, 0.09);

    color: #ffffff;

    font-size: 16px;

    transition:
        all 0.2s ease;
}


.controls input[type="text"]::placeholder {

    color:
        rgba(255, 255, 255, 0.55);
}


.controls input[type="text"]:focus {

    border-color:
        #60a5fa;

    box-shadow:
        0 0 0 3px
        rgba(96, 165, 250, 0.15);

    background:
        rgba(255, 255, 255, 0.13);
}


/* =====================================================
   MAIN CONTROL BUTTONS
===================================================== */

.controls button {

    padding:
        11px 17px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #6366f1
        );

    box-shadow:
        0 5px 15px
        rgba(59, 130, 246, 0.25);

    transition:
        all 0.2s ease;
}


.controls button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 22px
        rgba(59, 130, 246, 0.38);
}


.controls button:active {

    transform:
        scale(0.94);
}


/* =====================================================
   A+ / A-
===================================================== */

#plusBtn,
#minusBtn {

    min-width: 48px;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    box-shadow:
        0 5px 15px
        rgba(16, 185, 129, 0.25);
}


#plusBtn:hover,
#minusBtn:hover {

    box-shadow:
        0 8px 22px
        rgba(16, 185, 129, 0.4);
}


/* =====================================================
   RESET BUTTON
===================================================== */

#resetBtn {

    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );

    box-shadow:
        0 5px 15px
        rgba(239, 68, 68, 0.25);
}


#resetBtn:hover {

    box-shadow:
        0 8px 22px
        rgba(239, 68, 68, 0.4);
}


/* =====================================================
   COLOR PICKER
===================================================== */

.controls input[type="color"] {

    width: 48px;

    height: 42px;

    padding: 3px;

    border:
        2px solid
        rgba(255, 255, 255, 0.25);

    border-radius: 10px;

    background:
        rgba(255, 255, 255, 0.08);

    cursor: pointer;
}


/* =====================================================
   METER AREA
===================================================== */

#meterArea {

    position: relative;

    width: fit-content;

    max-width: 100%;

    margin:
        0 auto;

    padding: 7px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #334155,
            #0f172a
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    box-shadow:
        0 20px 45px
        rgba(0, 0, 0, 0.45);

    overflow: hidden;

    touch-action:
        pinch-zoom
        pan-x
        pan-y;

    user-select: none;

    -webkit-user-select: none;
}


/* =====================================================
   METER IMAGE
===================================================== */

#meterImage {

    display: block;

    width: auto;

    height: auto;

    max-width:
        min(
            900px,
            calc(100vw - 50px)
        );

    max-height: 75vh;

    border-radius: 11px;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;
}


/* =====================================================
   DIGIT LAYER
===================================================== */

#digitLayer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: visible;
}


/* =====================================================
   DIGIT GROUP
===================================================== */

.digit-group {

    position: absolute;

    display: flex;

    align-items: center;

    gap: 5px;

    cursor: grab;

    pointer-events: auto;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    transform-origin:
        center center;

    z-index: 20;

    --digit-color: #111111;

    will-change:
        transform,
        left,
        top;

    filter:
        drop-shadow(
            0 1px 1px
            rgba(255,255,255,0.15)
        );
}


.digit-group.dragging {

    cursor: grabbing;
}


/* =====================================================
   SEVEN SEGMENT DIGIT
===================================================== */

.seven-digit {

    position: relative;

    width: 28px;

    height: 48px;

    flex-shrink: 0;
}


.seven-digit span {

    position: absolute;

    display: block;

    background:
        var(--digit-color);

    border-radius: 3px;

    opacity: 0;
}


.seven-digit span.on {

    opacity: 0.95;

    box-shadow:
        0 0 2px
        rgba(0,0,0,0.5);
}


/* =====================================================
   HORIZONTAL SEGMENTS
===================================================== */

.seven-digit .a,
.seven-digit .g,
.seven-digit .d {

    width: 20px;

    height: 5px;

    left: 4px;
}


/* =====================================================
   VERTICAL SEGMENTS
===================================================== */

.seven-digit .f,
.seven-digit .b,
.seven-digit .e,
.seven-digit .c {

    width: 5px;

    height: 18px;
}


/* =====================================================
   SEGMENT POSITIONS
===================================================== */

.seven-digit .a {
    top: 0;
}

.seven-digit .g {
    top: 21px;
}

.seven-digit .d {
    bottom: 0;
}

.seven-digit .f {
    left: 0;
    top: 3px;
}

.seven-digit .b {
    right: 0;
    top: 3px;
}

.seven-digit .e {
    left: 0;
    bottom: 3px;
}

.seven-digit .c {
    right: 0;
    bottom: 3px;
}


/* =====================================================
   STATUS
===================================================== */

#status {

    text-align: center;

    margin-top: 15px;

    color:
        rgba(255,255,255,0.7);

    font-size: 14px;
}


/* =====================================================
   HINT
===================================================== */

.hint {

    text-align: center;

    margin-top: 12px;

    padding: 10px;

    color:
        rgba(255,255,255,0.65);

    font-size: 13px;

    line-height: 1.6;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .container {

        width:
            calc(100% - 14px);

        margin:
            8px auto;

        padding: 12px;

        border-radius: 17px;
    }


    h1 {

        font-size: 23px;

        margin-bottom: 16px;
    }


    .meter-buttons {

        padding: 10px;

        gap: 5px;

        border-radius: 12px;
    }


    .meter-buttons button {

        min-width: 38px;

        padding:
            7px 9px;

        font-size: 12px;

        border-radius: 8px;
    }


    .controls {

        padding: 10px;

        gap: 7px;

        border-radius: 12px;
    }


    .controls input[type="text"] {

        width: 145px;

        font-size: 15px;
    }


    .controls button {

        padding:
            9px 12px;

        border-radius: 9px;
    }


    #meterArea {

        padding: 5px;

        border-radius: 14px;

        border-width: 1px;
    }


    #meterImage {

        max-width:
            calc(100vw - 30px);

        max-height: 70vh;

        border-radius: 9px;
    }


    .digit-group {

        gap: 3px;
    }


    .seven-digit {

        width: 22px;

        height: 38px;
    }


    .seven-digit .a,
    .seven-digit .g,
    .seven-digit .d {

        width: 15px;

        height: 4px;

        left: 3.5px;
    }


    .seven-digit .f,
    .seven-digit .b,
    .seven-digit .e,
    .seven-digit .c {

        width: 4px;

        height: 14px;
    }


    .seven-digit .g {

        top: 17px;
    }


    .seven-digit .f {

        left: 0;

        top: 2px;
    }


    .seven-digit .b {

        right: 0;

        top: 2px;
    }


    .seven-digit .e {

        left: 0;

        bottom: 2px;
    }


    .seven-digit .c {

        right: 0;

        bottom: 2px;
    }

}

</style>
</head>


<body>


<div class="container">


<h1>
    Smart Meter Digit Editor
</h1>


<!-- =====================================================
     METER BUTTONS
===================================================== -->

<div class="meter-buttons">

    <button data-meter="1">1</button>
    <button data-meter="2">2</button>
    <button data-meter="3">3</button>
    <button data-meter="4">4</button>
    <button data-meter="5">5</button>
    <button data-meter="6">6</button>
    <button data-meter="7">7</button>
    <button data-meter="8">8</button>
    <button data-meter="9">9</button>
    <button data-meter="10">10</button>
    <button data-meter="11">11</button>
    <button data-meter="12">12</button>
    <button data-meter="13">13</button>
    <button data-meter="14">14</button>
    <button data-meter="15">15</button>

</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <input
        type="text"
        id="readingInput"
        placeholder="Enter digits"
        inputmode="numeric"
    >

    <button id="updateBtn">
        Update
    </button>

    <button id="plusBtn">
        A+
    </button>

    <button id="minusBtn">
        A-
    </button>

    <input
        type="color"
        id="digitColor"
        value="#111111"
        title="Digit Color"
    >

    <button id="resetBtn">
        Reset
    </button>

</div>


<!-- =====================================================
     METER
===================================================== -->

<div id="meterArea">

    <img
        id="meterImage"
        src=""
        alt="Meter"
    >

    <div id="digitLayer"></div>

</div>


<div id="status">
    Ready
</div>


<div class="hint">

    📱 1 Finger = Move Digits

    <br>

    🤏 2 Fingers on Digits = Zoom Digits

    <br>

    🤏 2 Fingers outside Digits = Zoom Page

</div>


</div>


<script>


/* =====================================================
   METER IMAGES
===================================================== */

const meterImages = {

    1: "./genus-solar-meter-250x250.webp",

    2: "WhatsApp Image 2026-06-12 at 8.35.39 AM (1).jpeg",

    3: "WhatsApp Image 2026-06-12 at 8.35.39 AM.jpeg",

    4: "WhatsApp Image 2026-06-22 at 4.17.11 PM.jpeg",

    5: "WhatsApp Image 2026-06-22 at 4.17.12 PM (1).jpeg",

    6: "WhatsApp Image 2026-06-22 at 4.17.12 PM.jpeg",

    7: "WhatsApp Image 2026-06-22 at 4.17.13 PM.jpeg",

    8: "WhatsApp Image 2026-06-22 at 4.17.14 PM (1).jpeg",

    9: "WhatsApp Image 2026-06-22 at 4.17.14 PM.jpeg",

    10: "WhatsApp Image 2026-06-22 at 4.17.15 PM (1).jpeg",

    11: "WhatsApp Image 2026-06-22 at 4.17.15 PM.jpeg",

    12: "WhatsApp Image 2026-06-22 at 4.17.16 PM (1).jpeg",

    13: "WhatsApp Image 2026-06-22 at 4.17.16 PM.jpeg",

    14: "WhatsApp Image 2026-06-22 at 4.17.17 PM (1).jpeg",

    15: "WhatsApp Image 2026-06-22 at 4.17.17 PM.jpeg"

};


/* =====================================================
   ELEMENTS
===================================================== */

const meterImage =
    document.getElementById("meterImage");

const meterArea =
    document.getElementById("meterArea");

const digitLayer =
    document.getElementById("digitLayer");

const readingInput =
    document.getElementById("readingInput");

const updateBtn =
    document.getElementById("updateBtn");

const plusBtn =
    document.getElementById("plusBtn");

const minusBtn =
    document.getElementById("minusBtn");

const digitColor =
    document.getElementById("digitColor");

const resetBtn =
    document.getElementById("resetBtn");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let digitGroup = null;

let scale = 1;

let currentX = 0;

let currentY = 0;


/* =====================================================
   SEVEN SEGMENT MAP
===================================================== */

const segmentMap = {

    0: ["a", "b", "c", "d", "e", "f"],

    1: ["b", "c"],

    2: ["a", "b", "g", "e", "d"],

    3: ["a", "b", "c", "d", "g"],

    4: ["f", "g", "b", "c"],

    5: ["a", "f", "g", "c", "d"],

    6: ["a", "f", "g", "e", "c", "d"],

    7: ["a", "b", "c"],

    8: ["a", "b", "c", "d", "e", "f", "g"],

    9: ["a", "b", "c", "d", "f", "g"]

};


/* =====================================================
   METER BUTTONS
===================================================== */

document
.querySelectorAll("[data-meter]")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const meterNumber =
                this.dataset.meter;


            meterImage.src =
                meterImages[meterNumber];


            status.textContent =
                "Loading meter...";


            meterImage.onload =
                function() {

                    status.textContent =
                        "Meter " +
                        meterNumber +
                        " loaded";

                    resetPosition();

                };


            meterImage.onerror =
                function() {

                    status.textContent =
                        "Meter image not found";

                };

        }
    );

});


/* =====================================================
   FIRST METER
===================================================== */

meterImage.src =
    meterImages[1];


meterImage.onload =
    function() {

        status.textContent =
            "Meter 1 loaded";

    };


/* =====================================================
   MAKE DIGIT
===================================================== */

function makeDigit(number) {

    const digit =
        document.createElement("div");

    digit.className =
        "seven-digit";


    const segments = [
        "a",
        "b",
        "c",
        "d",
        "e",
        "f",
        "g"
    ];


    segments.forEach(
        function(segmentName) {

            const segment =
                document.createElement("span");


            segment.className =
                segmentName;


            if (
                segmentMap[number]
                .includes(segmentName)
            ) {

                segment.classList.add("on");

            }


            digit.appendChild(segment);

        }
    );


    return digit;
}


/* =====================================================
   CREATE DIGITS
===================================================== */

function createDigits(value) {

    digitLayer.innerHTML = "";


    const cleanValue =
        String(value)
        .replace(/\D/g, "");


    if (!cleanValue) {

        digitGroup = null;

        return;
    }


    digitGroup =
        document.createElement("div");


    digitGroup.className =
        "digit-group";


    cleanValue
    .split("")
    .forEach(
        function(number) {

            digitGroup.appendChild(
                makeDigit(
                    Number(number)
                )
            );

        }
    );


    digitLayer.appendChild(
        digitGroup
    );


    scale = 1;


    digitGroup.style.setProperty(
        "--digit-color",
        digitColor.value
    );


    resetPosition();


    /*
       IMPORTANT
       Mouse + Touch system
    */

    enableDigitControls(
        digitGroup
    );

}


/* =====================================================
   RESET POSITION
===================================================== */

function resetPosition() {

    if (!digitGroup) {
        return;
    }


    const areaWidth =
        meterArea.clientWidth;

    const areaHeight =
        meterArea.clientHeight;


    const groupWidth =
        digitGroup.offsetWidth;

    const groupHeight =
        digitGroup.offsetHeight;


    currentX =
        (areaWidth - groupWidth) / 2;


    currentY =
        (areaHeight - groupHeight) / 2;


    apply();

}


/* =====================================================
   APPLY
===================================================== */

function apply() {

    if (!digitGroup) {
        return;
    }


    digitGroup.style.left =
        currentX + "px";


    digitGroup.style.top =
        currentY + "px";


    digitGroup.style.transform =
        "scale(" + scale + ")";

}


/* =====================================================
   MOUSE + TOUCH CONTROLS
===================================================== */

function enableDigitControls(element) {


    /* =================================================
       MOUSE DRAG
    ================================================= */

    let mouseDragging = false;

    let mouseStartX = 0;
    let mouseStartY = 0;

    let mouseOriginalX = 0;
    let mouseOriginalY = 0;


    element.addEventListener(
        "mousedown",
        function(event) {

            /*
               Only actual mouse.
            */

            if (event.button !== 0) {
                return;
            }


            event.preventDefault();


            mouseDragging = true;


            mouseStartX =
                event.clientX;

            mouseStartY =
                event.clientY;


            mouseOriginalX =
                currentX;

            mouseOriginalY =
                currentY;


            element.classList.add(
                "dragging"
            );


            /*
               Capture mouse movements
               even outside the digit.
            */

            try {

                element.setPointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if (!mouseDragging) {
                return;
            }


            currentX =
                mouseOriginalX +
                (
                    event.clientX -
                    mouseStartX
                );


            currentY =
                mouseOriginalY +
                (
                    event.clientY -
                    mouseStartY
                );


            apply();

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            if (!mouseDragging) {
                return;
            }


            mouseDragging = false;


            element.classList.remove(
                "dragging"
            );

        }
    );


    /* =================================================
       TOUCH
    ================================================= */

    let dragStartX = 0;
    let dragStartY = 0;

    let dragOriginalX = 0;
    let dragOriginalY = 0;


    let pinchStartDistance = 0;

    let pinchStartScale = 1;


    /* =================================================
       DISTANCE
    ================================================= */

    function getDistance(touch1, touch2) {

        const dx =
            touch1.clientX -
            touch2.clientX;


        const dy =
            touch1.clientY -
            touch2.clientY;


        return Math.sqrt(
            dx * dx +
            dy * dy
        );

    }


    /* =================================================
       TOUCH START
    ================================================= */

    element.addEventListener(
        "touchstart",
        function(event) {

            /*
               Prevent browser zoom ONLY
               while fingers are on digits.
            */

            event.preventDefault();


            /* -----------------------------------------
               ONE FINGER
            ----------------------------------------- */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                dragStartX =
                    touch.clientX;


                dragStartY =
                    touch.clientY;


                dragOriginalX =
                    currentX;


                dragOriginalY =
                    currentY;


                element.classList.add(
                    "dragging"
                );

            }


            /* -----------------------------------------
               TWO FINGERS
            ----------------------------------------- */

            if (
                event.touches.length === 2
            ) {

                const touch1 =
                    event.touches[0];


                const touch2 =
                    event.touches[1];


                pinchStartDistance =
                    getDistance(
                        touch1,
                        touch2
                    );


                pinchStartScale =
                    scale;


                element.classList.remove(
                    "dragging"
                );

            }

        },
        {
            passive: false
        }
    );


    /* =================================================
       TOUCH MOVE
    ================================================= */

    element.addEventListener(
        "touchmove",
        function(event) {

            event.preventDefault();


            /* -----------------------------------------
               TWO FINGER ZOOM
            ----------------------------------------- */

            if (
                event.touches.length === 2
            ) {

                const touch1 =
                    event.touches[0];


                const touch2 =
                    event.touches[1];


                const currentDistance =
                    getDistance(
                        touch1,
                        touch2
                    );


                if (
                    pinchStartDistance > 0
                ) {

                    const ratio =
                        currentDistance /
                        pinchStartDistance;


                    /*
                       FAST RESPONSE
                    */

                    const zoomRatio =
                        1 +
                        (
                            (ratio - 1)
                            * 1.5
                        );


                    scale =
                        pinchStartScale *
                        zoomRatio;


                    /*
                       Minimum
                    */

                    scale =
                        Math.max(
                            0.25,
                            scale
                        );


                    /*
                       Maximum
                    */

                    scale =
                        Math.min(
                            5,
                            scale
                        );


                    apply();

                }


                return;
            }


            /* -----------------------------------------
               ONE FINGER MOVE
            ----------------------------------------- */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                currentX =
                    dragOriginalX +
                    (
                        touch.clientX -
                        dragStartX
                    );


                currentY =
                    dragOriginalY +
                    (
                        touch.clientY -
                        dragStartY
                    );


                apply();

            }

        },
        {
            passive: false
        }
    );


    /* =================================================
       TOUCH END
    ================================================= */

    element.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();


            /*
               ALL FINGERS REMOVED
            */

            if (
                event.touches.length === 0
            ) {

                pinchStartDistance = 0;


                element.classList.remove(
                    "dragging"
                );


                return;
            }


            /*
               ONE FINGER LEFT
               AFTER PINCH
            */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                dragStartX =
                    touch.clientX;


                dragStartY =
                    touch.clientY;


                dragOriginalX =
                    currentX;


                dragOriginalY =
                    currentY;


                pinchStartDistance = 0;

            }

        },
        {
            passive: false
        }
    );


    /* =================================================
       TOUCH CANCEL
    ================================================= */

    element.addEventListener(
        "touchcancel",
        function() {

            pinchStartDistance = 0;

            element.classList.remove(
                "dragging"
            );

        },
        {
            passive: false
        }
    );

}


/* =====================================================
   UPDATE BUTTON
===================================================== */

updateBtn.addEventListener(
    "click",
    function() {

        const value =
            readingInput.value.trim();


        if (!value) {

            alert(
                "Please enter digits."
            );

            return;
        }


        if (!/^\d+$/.test(value)) {

            alert(
                "Please enter numbers only."
            );

            return;
        }


        createDigits(value);

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

readingInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            updateBtn.click();

        }

    }
);


/* =====================================================
   A+
===================================================== */

plusBtn.addEventListener(
    "click",
    function() {

        if (!digitGroup) {
            return;
        }


        scale += 0.1;


        scale =
            Math.min(
                5,
                scale
            );


        apply();

    }
);


/* =====================================================
   A-
===================================================== */

minusBtn.addEventListener(
    "click",
    function() {

        if (!digitGroup) {
            return;
        }


        scale -= 0.1;


        scale =
            Math.max(
                0.25,
                scale
            );


        apply();

    }
);


/* =====================================================
   COLOR
===================================================== */

digitColor.addEventListener(
    "input",
    function() {

        if (!digitGroup) {
            return;
        }


        digitGroup.style.setProperty(
            "--digit-color",
            digitColor.value
        );

    }
);


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    function() {

        readingInput.value = "";

        digitLayer.innerHTML = "";

        digitGroup = null;

        scale = 1;

        currentX = 0;

        currentY = 0;

        status.textContent =
            "Reset";

    }
);


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        if (digitGroup) {

            apply();

        }

    }
);

</script>
