<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Smart Meter Digit Editor</title>


<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background: #f2f2f2;

    /*
       IMPORTANT:
       Page zoom is now allowed.
    */

    touch-action: pan-x pan-y pinch-zoom;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1100px;

    margin: 20px auto;

    padding: 15px;
}


h1 {

    text-align: center;

    margin-bottom: 20px;

}


/* =====================================================
   METER BUTTONS
===================================================== */

.meter-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

    margin-bottom: 15px;
}


.meter-buttons button {

    padding: 8px 13px;

    border: none;

    background: #333;

    color: white;

    border-radius: 5px;

    cursor: pointer;

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}


.controls input[type="text"] {

    width: 180px;

    padding: 10px;

    border: 1px solid #aaa;

    border-radius: 5px;

    font-size: 16px;
}


.controls button {

    padding: 10px 14px;

    border: none;

    border-radius: 5px;

    background: #222;

    color: white;

    cursor: pointer;
}


.controls input[type="color"] {

    width: 50px;

    height: 40px;

    padding: 2px;
}


/* =====================================================
   METER AREA
===================================================== */

#meterArea {

    position: relative;

    width: fit-content;

    max-width: 100%;

    margin: 0 auto;

    border: 8px solid #222;

    overflow: hidden;

    /*
       IMPORTANT:

       We allow normal browser pinch on the page.
    */

    touch-action: pinch-zoom pan-x pan-y;

    user-select: none;

    -webkit-user-select: none;
}


#meterImage {

    display: block;

    width: auto;

    height: auto;

    max-width: min(
        900px,
        calc(100vw - 50px)
    );

    max-height: 75vh;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;
}


#digitLayer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: visible;
}


/* =====================================================
   DIGIT GROUP
===================================================== */

.digit-group {

    position: absolute;

    display: flex;

    align-items: center;

    gap: 5px;

    cursor: grab;

    pointer-events: auto;

    /*
       IMPORTANT:

       Browser page pinch is disabled ONLY while
       touching the digit itself.

       This lets our custom pinch work immediately.
    */

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    transform-origin: center center;

    z-index: 20;

    --digit-color: #111111;

    /*
       Very important for smooth transform.
    */

    will-change: transform, left, top;
}


.digit-group.dragging {

    cursor: grabbing;
}


/* =====================================================
   SEVEN SEGMENT DIGIT
===================================================== */

.seven-digit {

    position: relative;

    width: 28px;

    height: 48px;

    flex-shrink: 0;
}


.seven-digit span {

    position: absolute;

    display: block;

    background: var(--digit-color);

    border-radius: 3px;

    opacity: 0;
}


.seven-digit span.on {

    opacity: 0.95;
}


/* Horizontal */

.seven-digit .a,
.seven-digit .g,
.seven-digit .d {

    width: 20px;

    height: 5px;

    left: 4px;
}


/* Vertical */

.seven-digit .f,
.seven-digit .b,
.seven-digit .e,
.seven-digit .c {

    width: 5px;

    height: 18px;
}


/* Positions */

.seven-digit .a {

    top: 0;
}


.seven-digit .g {

    top: 21px;
}


.seven-digit .d {

    bottom: 0;
}


.seven-digit .f {

    left: 0;

    top: 3px;
}


.seven-digit .b {

    right: 0;

    top: 3px;
}


.seven-digit .e {

    left: 0;

    bottom: 3px;
}


.seven-digit .c {

    right: 0;

    bottom: 3px;
}


/* =====================================================
   MOBILE DIGITS
===================================================== */

@media (max-width: 600px) {

    .container {

        padding: 8px;

        margin-top: 10px;
    }


    h1 {

        font-size: 22px;
    }


    .meter-buttons {

        gap: 5px;
    }


    .meter-buttons button {

        padding: 7px 9px;

        font-size: 13px;
    }


    .controls {

        gap: 6px;
    }


    .controls input[type="text"] {

        width: 150px;
    }


    #meterArea {

        border-width: 5px;
    }


    #meterImage {

        max-width: calc(100vw - 26px);

        max-height: 70vh;
    }


    .digit-group {

        gap: 3px;
    }


    .seven-digit {

        width: 22px;

        height: 38px;
    }


    .seven-digit .a,
    .seven-digit .g,
    .seven-digit .d {

        width: 15px;

        height: 4px;

        left: 3.5px;
    }


    .seven-digit .f,
    .seven-digit .b,
    .seven-digit .e,
    .seven-digit .c {

        width: 4px;

        height: 14px;
    }


    .seven-digit .g {

        top: 17px;
    }


    .seven-digit .f {

        top: 2px;
    }


    .seven-digit .b {

        top: 2px;
    }


    .seven-digit .e {

        bottom: 2px;
    }


    .seven-digit .c {

        bottom: 2px;
    }

}


/* =====================================================
   STATUS
===================================================== */

#status {

    text-align: center;

    margin-top: 10px;

    color: #555;

    font-size: 14px;
}


.hint {

    text-align: center;

    margin-top: 10px;

    color: #666;

    font-size: 14px;
}

</style>

</head>


<body>


<div class="container">


<h1>
    Smart Meter Digit Editor
</h1>


<!-- ===================================================
     METER BUTTONS
==================================================== -->

<div class="meter-buttons">

    <button data-meter="1">1</button>
    <button data-meter="2">2</button>
    <button data-meter="3">3</button>
    <button data-meter="4">4</button>
    <button data-meter="5">5</button>
    <button data-meter="6">6</button>
    <button data-meter="7">7</button>
    <button data-meter="8">8</button>
    <button data-meter="9">9</button>
    <button data-meter="10">10</button>
    <button data-meter="11">11</button>
    <button data-meter="12">12</button>
    <button data-meter="13">13</button>
    <button data-meter="14">14</button>
    <button data-meter="15">15</button>

</div>


<!-- ===================================================
     CONTROLS
==================================================== -->

<div class="controls">

    <input
        type="text"
        id="readingInput"
        placeholder="Enter digits"
        inputmode="numeric"
    >

    <button id="updateBtn">
        Update
    </button>

    <button id="plusBtn">
        A+
    </button>

    <button id="minusBtn">
        A-
    </button>

    <input
        type="color"
        id="digitColor"
        value="#111111"
        title="Digit Color"
    >

    <button id="resetBtn">
        Reset
    </button>

</div>


<!-- ===================================================
     METER
==================================================== -->

<div id="meterArea">

    <img
        id="meterImage"
        src=""
        alt="Meter"
    >

    <div id="digitLayer"></div>

</div>


<div id="status">
    Ready
</div>


<div class="hint">

    📱 1 Finger = Move Digits
    <br>

    🤏 2 Fingers on Digits = Fast Zoom In / Zoom Out
    <br>

    📱 2 Fingers outside Digits = Normal Page Zoom

</div>


</div>


<script>


/* =====================================================
   METER IMAGES
===================================================== */

const meterImages = {

    1: "./genus-solar-meter-250x250.webp",

    2: "WhatsApp Image 2026-06-12 at 8.35.39 AM (1).jpeg",

    3: "WhatsApp Image 2026-06-12 at 8.35.39 AM.jpeg",

    4: "WhatsApp Image 2026-06-22 at 4.17.11 PM.jpeg",

    5: "WhatsApp Image 2026-06-22 at 4.17.12 PM (1).jpeg",

    6: "WhatsApp Image 2026-06-22 at 4.17.12 PM.jpeg",

    7: "WhatsApp Image 2026-06-22 at 4.17.13 PM.jpeg",

    8: "WhatsApp Image 2026-06-22 at 4.17.14 PM (1).jpeg",

    9: "WhatsApp Image 2026-06-22 at 4.17.14 PM.jpeg",

    10: "WhatsApp Image 2026-06-22 at 4.17.15 PM (1).jpeg",

    11: "WhatsApp Image 2026-06-22 at 4.17.15 PM.jpeg",

    12: "WhatsApp Image 2026-06-22 at 4.17.16 PM (1).jpeg",

    13: "WhatsApp Image 2026-06-22 at 4.17.16 PM.jpeg",

    14: "WhatsApp Image 2026-06-22 at 4.17.17 PM (1).jpeg",

    15: "WhatsApp Image 2026-06-22 at 4.17.17 PM.jpeg"

};


/* =====================================================
   ELEMENTS
===================================================== */

const meterImage =
    document.getElementById("meterImage");

const meterArea =
    document.getElementById("meterArea");

const digitLayer =
    document.getElementById("digitLayer");

const readingInput =
    document.getElementById("readingInput");

const updateBtn =
    document.getElementById("updateBtn");

const plusBtn =
    document.getElementById("plusBtn");

const minusBtn =
    document.getElementById("minusBtn");

const digitColor =
    document.getElementById("digitColor");

const resetBtn =
    document.getElementById("resetBtn");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let digitGroup = null;

let scale = 1;

let currentX = 0;

let currentY = 0;


/* =====================================================
   SEVEN SEGMENT MAP
===================================================== */

const segmentMap = {

    0: ["a", "b", "c", "d", "e", "f"],

    1: ["b", "c"],

    2: ["a", "b", "g", "e", "d"],

    3: ["a", "b", "c", "d", "g"],

    4: ["f", "g", "b", "c"],

    5: ["a", "f", "g", "c", "d"],

    6: ["a", "f", "g", "e", "c", "d"],

    7: ["a", "b", "c"],

    8: ["a", "b", "c", "d", "e", "f", "g"],

    9: ["a", "b", "c", "d", "f", "g"]

};


/* =====================================================
   METER BUTTONS
===================================================== */

document
    .querySelectorAll("[data-meter]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const meterNumber =
                    button.dataset.meter;

                meterImage.src =
                    meterImages[meterNumber];

                status.textContent =
                    "Loading meter...";


                meterImage.onload = () => {

                    status.textContent =
                        "Meter " +
                        meterNumber +
                        " loaded";

                    resetPosition();

                };


                meterImage.onerror = () => {

                    status.textContent =
                        "Meter image not found";

                };

            }
        );

    });


/* =====================================================
   FIRST METER
===================================================== */

meterImage.src =
    meterImages[1];


meterImage.onload = () => {

    status.textContent =
        "Meter 1 loaded";

};


/* =====================================================
   MAKE DIGIT
===================================================== */

function makeDigit(number) {

    const digit =
        document.createElement("div");

    digit.className =
        "seven-digit";


    const segments = [

        "a",
        "b",
        "c",
        "d",
        "e",
        "f",
        "g"

    ];


    segments.forEach(segmentName => {

        const segment =
            document.createElement("span");

        segment.className =
            segmentName;


        if (
            segmentMap[number]
                .includes(segmentName)
        ) {

            segment.classList.add("on");

        }


        digit.appendChild(segment);

    });


    return digit;

}


/* =====================================================
   CREATE DIGITS
===================================================== */

function createDigits(value) {

    digitLayer.innerHTML = "";

    const cleanValue =
        String(value)
            .replace(/\D/g, "");


    if (!cleanValue) {

        digitGroup = null;

        return;

    }


    digitGroup =
        document.createElement("div");

    digitGroup.className =
        "digit-group";


    cleanValue
        .split("")
        .forEach(number => {

            digitGroup.appendChild(
                makeDigit(Number(number))
            );

        });


    digitLayer.appendChild(
        digitGroup
    );


    scale = 1;


    digitGroup.style.setProperty(
        "--digit-color",
        digitColor.value
    );


    resetPosition();


    enableDigitTouch(
        digitGroup
    );

}


/* =====================================================
   RESET POSITION
===================================================== */

function resetPosition() {

    if (!digitGroup) {
        return;
    }


    const areaWidth =
        meterArea.clientWidth;

    const areaHeight =
        meterArea.clientHeight;


    const groupWidth =
        digitGroup.offsetWidth;

    const groupHeight =
        digitGroup.offsetHeight;


    currentX =
        (areaWidth - groupWidth) / 2;

    currentY =
        (areaHeight - groupHeight) / 2;


    apply();

}


/* =====================================================
   APPLY
===================================================== */

function apply() {

    if (!digitGroup) {
        return;
    }


    digitGroup.style.left =
        currentX + "px";


    digitGroup.style.top =
        currentY + "px";


    digitGroup.style.transform =
        "scale(" + scale + ")";

}


/* =====================================================
   DIGIT TOUCH SYSTEM
===================================================== */

function enableDigitTouch(element) {


    let fingerCount = 0;


    /* ================================================
       SINGLE FINGER DRAG
    ================================================= */

    let dragStartX = 0;

    let dragStartY = 0;

    let dragOriginalX = 0;

    let dragOriginalY = 0;


    /* ================================================
       PINCH
    ================================================= */

    let pinchStartDistance = 0;

    let pinchStartScale = 1;


    /* ================================================
       GET DISTANCE
    ================================================= */

    function getDistance(touch1, touch2) {

        const dx =
            touch1.clientX -
            touch2.clientX;

        const dy =
            touch1.clientY -
            touch2.clientY;


        return Math.sqrt(
            (dx * dx) +
            (dy * dy)
        );

    }


    /* ================================================
       TOUCH START
    ================================================= */

    element.addEventListener(
        "touchstart",
        function(event) {

            /*
             * VERY IMPORTANT
             *
             * Prevent browser page zoom
             * ONLY when fingers touch digits.
             */

            event.preventDefault();


            fingerCount =
                event.touches.length;


            /* -----------------------------------------
               ONE FINGER
            ----------------------------------------- */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                dragStartX =
                    touch.clientX;

                dragStartY =
                    touch.clientY;


                dragOriginalX =
                    currentX;

                dragOriginalY =
                    currentY;


                element.classList.add(
                    "dragging"
                );

            }


            /* -----------------------------------------
               TWO FINGERS
            ----------------------------------------- */

            if (
                event.touches.length === 2
            ) {

                const touch1 =
                    event.touches[0];

                const touch2 =
                    event.touches[1];


                pinchStartDistance =
                    getDistance(
                        touch1,
                        touch2
                    );


                pinchStartScale =
                    scale;


                element.classList.remove(
                    "dragging"
                );

            }

        },
        {
            passive: false
        }
    );


    /* ================================================
       TOUCH MOVE
    ================================================= */

    element.addEventListener(
        "touchmove",
        function(event) {

            event.preventDefault();


            /* -----------------------------------------
               TWO FINGER PINCH
            ----------------------------------------- */

            if (
                event.touches.length === 2
            ) {

                const touch1 =
                    event.touches[0];

                const touch2 =
                    event.touches[1];


                const currentDistance =
                    getDistance(
                        touch1,
                        touch2
                    );


                if (
                    pinchStartDistance > 0
                ) {

                    /*
                     * DIRECT RATIO
                     *
                     * Fingers 5px apart =
                     * immediate visible change.
                     */

                    const ratio =
                        currentDistance /
                        pinchStartDistance;


                    /*
                     * Slightly stronger response
                     * so zoom feels fast.
                     */

                    const fastRatio =
                        1 +
                        ((ratio - 1) * 1.35);


                    scale =
                        pinchStartScale *
                        fastRatio;


                    /*
                     * MIN
                     */

                    if (scale < 0.25) {

                        scale = 0.25;

                    }


                    /*
                     * MAX
                     */

                    if (scale > 5) {

                        scale = 5;

                    }


                    apply();

                }


                return;

            }


            /* -----------------------------------------
               ONE FINGER DRAG
            ----------------------------------------- */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                currentX =
                    dragOriginalX +
                    (
                        touch.clientX -
                        dragStartX
                    );


                currentY =
                    dragOriginalY +
                    (
                        touch.clientY -
                        dragStartY
                    );


                apply();

            }

        },
        {
            passive: false
        }
    );


    /* ================================================
       TOUCH END
    ================================================= */

    element.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();


            /*
             * NO FINGER
             */

            if (
                event.touches.length === 0
            ) {

                fingerCount = 0;

                pinchStartDistance = 0;

                element.classList.remove(
                    "dragging"
                );

                return;

            }


            /*
             * AFTER PINCH
             *
             * One finger remains.
             */

            if (
                event.touches.length === 1
            ) {

                const touch =
                    event.touches[0];


                dragStartX =
                    touch.clientX;

                dragStartY =
                    touch.clientY;


                dragOriginalX =
                    currentX;

                dragOriginalY =
                    currentY;


                pinchStartDistance = 0;

            }

        },
        {
            passive: false
        }
    );


    /* ================================================
       TOUCH CANCEL
    ================================================= */

    element.addEventListener(
        "touchcancel",
        function(event) {

            event.preventDefault();

            pinchStartDistance = 0;

            element.classList.remove(
                "dragging"
            );

        },
        {
            passive: false
        }
    );

}


/* =====================================================
   UPDATE
===================================================== */

updateBtn.addEventListener(
    "click",
    function() {

        const value =
            readingInput.value.trim();


        if (!value) {

            alert(
                "Please enter digits."
            );

            return;

        }


        if (!/^\d+$/.test(value)) {

            alert(
                "Please enter numbers only."
            );

            return;

        }


        createDigits(value);

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

readingInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            updateBtn.click();

        }

    }
);


/* =====================================================
   A+
===================================================== */

plusBtn.addEventListener(
    "click",
    function() {

        if (!digitGroup) {
            return;
        }


        scale += 0.1;


        if (scale > 5) {
            scale = 5;
        }


        apply();

    }
);


/* =====================================================
   A-
===================================================== */

minusBtn.addEventListener(
    "click",
    function() {

        if (!digitGroup) {
            return;
        }


        scale -= 0.1;


        if (scale < 0.25) {
            scale = 0.25;
        }


        apply();

    }
);


/* =====================================================
   COLOR
===================================================== */

digitColor.addEventListener(
    "input",
    function() {

        if (!digitGroup) {
            return;
        }


        digitGroup.style.setProperty(
            "--digit-color",
            digitColor.value
        );

    }
);


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    function() {

        readingInput.value = "";

        digitLayer.innerHTML = "";

        digitGroup = null;

        scale = 1;

        currentX = 0;

        currentY = 0;

        status.textContent =
            "Reset";

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        if (digitGroup) {

            apply();

        }

    }
);

</script>

</body>
</html>
