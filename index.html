<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Smart Meter Digit Editor</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #0f172a;
    color: #fff;

    font-family: Arial, sans-serif;

    overscroll-behavior: none;
}

body {
    min-height: 100vh;
}


/* =========================================================
   HEADING
========================================================= */

h1 {

    text-align: center;

    margin: 20px 0;

    font-size: 30px;
}


/* =========================================================
   METER BUTTONS
========================================================= */

.meter-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

    padding: 0 20px 18px;
}

button {

    border: 0;

    border-radius: 7px;

    padding: 10px 15px;

    font-weight: bold;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.meter-buttons button {

    background: #2563eb;

    color: #fff;
}


/* =========================================================
   CONTROL AREA
========================================================= */

.controls {

    width: min(1000px, calc(100% - 30px));

    margin: auto auto 20px;

    padding: 14px;

    background: #263247;

    border-radius: 10px;

    display: flex;

    gap: 8px;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;
}


/* =========================================================
   INPUT
========================================================= */

#readingInput {

    width: 300px;

    max-width: 90vw;

    padding: 11px;

    border: 0;

    border-radius: 6px;

    font-size: 16px;
}


/* =========================================================
   CONTROL BUTTONS
========================================================= */

.control {

    background: #10b981;

    color: #fff;
}

.control:hover {

    background: #059669;
}


/* =========================================================
   COLOR PICKER
========================================================= */

#digitColor {

    width: 42px;

    height: 38px;

    padding: 2px;
}


/* =========================================================
   EDITOR
========================================================= */

.editor {

    width: min(1000px, calc(100% - 30px));

    margin: auto;

    padding-bottom: 40px;
}


/* =========================================================
   METER AREA
========================================================= */

#meterArea {

    position: relative;

    width: fit-content;

    max-width: 100%;

    margin: auto;

    border: 8px solid white;

    border-radius: 16px;

    overflow: hidden;

    background: #222;
    touch-action: none;

    /*
       Important for mobile touch.
    */

    touch-action: none;
}


/* =========================================================
   METER IMAGE
========================================================= */

#meterImage {

    display: block;

    width: auto;

    max-width: min(900px, calc(100vw - 50px));

    max-height: 75vh;

    height: auto;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}


/* =========================================================
   DIGIT LAYER
========================================================= */

#digitLayer {

    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =========================================================
   DIGIT GROUP
========================================================= */

.digit-group {

    position: absolute;

    display: flex;

    align-items: center;

    gap: 3px;

    padding: 2px;

    cursor: grab;

    pointer-events: auto;

    /*
       Important for phone.
    */

    touch-action: none;

    transform-origin: center center;

    user-select: none;

    -webkit-user-select: none;

    z-index: 10;
}

.digit-group.dragging {

    cursor: grabbing;
}


/* =========================================================
   7 SEGMENT DIGIT
========================================================= */

.seven-digit {

    --digit-color: #30352f;

    position: relative;

    width: 28px;

    height: 48px;

    flex: 0 0 28px;
}


/* =========================================================
   SEGMENTS
========================================================= */

.seg {

    position: absolute;

    background: rgba(45, 50, 45, 0.10);

    border-radius: 3px;
}

.seg.on {

    background: var(--digit-color);

    box-shadow:
        0 0 1px rgba(0, 0, 0, 0.8);
}


/* =========================================================
   HORIZONTAL SEGMENTS
========================================================= */

.seg.a,
.seg.d,
.seg.g {

    width: 19px;

    height: 5px;

    left: 4.5px;
}

.seg.a {

    top: 1px;
}

.seg.g {

    top: 21.5px;
}

.seg.d {

    bottom: 1px;
}


/* =========================================================
   VERTICAL SEGMENTS
========================================================= */

.seg.b,
.seg.c,
.seg.e,
.seg.f {

    width: 5px;

    height: 19px;
}

.seg.f {

    left: 0;

    top: 4px;
}

.seg.b {

    right: 0;

    top: 4px;
}

.seg.e {

    left: 0;

    bottom: 4px;
}

.seg.c {

    right: 0;

    bottom: 4px;
}


/* =========================================================
   HINT
========================================================= */

.hint {

    text-align: center;

    color: #cbd5e1;

    font-size: 14px;

    line-height: 1.5;

    margin-top: 10px;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    text-align: center;

    color: #94a3b8;

    font-size: 13px;

    min-height: 18px;

    margin-top: 6px;
}


/* =========================================================
   MOBILE CSS
========================================================= */

@media (max-width: 600px) {

    h1 {

        font-size: 24px;

        margin: 15px 0;
    }


    .controls {

        width: calc(100% - 20px);
    }


    .editor {

        width: calc(100% - 20px);
    }


    #meterArea {

        border-width: 5px;
    }


    #meterImage {

        max-width: calc(100vw - 30px);

        max-height: 75vh;
    }


    /*
       Mobile digits slightly smaller
    */

    .seven-digit {

        width: 22px;

        height: 38px;

        flex-basis: 22px;
    }


    .seg.a,
    .seg.d,
    .seg.g {

        width: 15px;

        height: 4px;

        left: 3.5px;
    }


    .seg.a {

        top: 1px;
    }


    .seg.g {

        top: 17px;
    }


    .seg.d {

        bottom: 1px;
    }


    .seg.b,
    .seg.c,
    .seg.e,
    .seg.f {

        width: 4px;

        height: 15px;
    }


    .seg.f {

        left: 0;

        top: 3px;
    }


    .seg.b {

        right: 0;

        top: 3px;
    }


    .seg.e {

        left: 0;

        bottom: 3px;
    }


    .seg.c {

        right: 0;

        bottom: 3px;
    }


    .hint {

        font-size: 13px;
    }

}

</style>

</head>


<body>


<h1>
    Smart Meter Digit Editor
</h1>


<!-- =====================================================
     METER BUTTONS
===================================================== -->

<div
    class="meter-buttons"
    id="meterButtons"
></div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">


    <input
        id="readingInput"
        type="text"
        inputmode="numeric"
        placeholder="Enter digits"
        autocomplete="off"
    >


    <button
        class="control"
        id="updateBtn"
    >
        Update Digit
    </button>


    <button
        class="control"
        id="plusBtn"
    >
        A+
    </button>


    <button
        class="control"
        id="minusBtn"
    >
        A-
    </button>


    <input
        id="digitColor"
        type="color"
        value="#30352f"
        title="Digit color"
    >


    <button
        class="control"
        id="resetBtn"
    >
        Reset
    </button>

</div>


<!-- =====================================================
     METER EDITOR
===================================================== -->

<div class="editor">


    <div id="meterArea">


        <img
            id="meterImage"
            alt="Electric meter"
        >


        <div id="digitLayer"></div>


    </div>


    <div class="hint">

        📱 Phone:
        1 finger = move digits |
        2 fingers pinch = resize

        <br>

        💻 Computer:
        mouse drag = move |
        A+ / A- = resize

    </div>


    <div
        class="status"
        id="status"
    ></div>


</div>



<script>


/* =========================================================
   METER IMAGES
========================================================= */

const meterImages = {

    1:
        "./genus-solar-meter-250x250.webp",

    2:
        "WhatsApp Image 2026-06-12 at 8.35.39 AM (1).jpeg",

    3:
        "WhatsApp Image 2026-06-12 at 8.35.39 AM.jpeg",

    4:
        "WhatsApp Image 2026-06-22 at 4.17.11 PM.jpeg",

    5:
        "WhatsApp Image 2026-06-22 at 4.17.12 PM (1).jpeg",

    6:
        "WhatsApp Image 2026-06-22 at 4.17.12 PM.jpeg",

    7:
        "WhatsApp Image 2026-06-22 at 4.17.13 PM.jpeg",

    8:
        "WhatsApp Image 2026-06-22 at 4.17.14 PM (1).jpeg",

    9:
        "WhatsApp Image 2026-06-22 at 4.17.14 PM.jpeg",

    10:
        "WhatsApp Image 2026-06-22 at 4.17.15 PM (1).jpeg",

    11:
        "WhatsApp Image 2026-06-22 at 4.17.15 PM.jpeg",

    12:
        "WhatsApp Image 2026-06-22 at 4.17.16 PM (1).jpeg",

    13:
        "WhatsApp Image 2026-06-22 at 4.17.16 PM.jpeg",

    14:
        "WhatsApp Image 2026-06-22 at 4.17.17 PM (1).jpeg",

    15:
        "WhatsApp Image 2026-06-22 at 4.17.17 PM.jpeg"

};


/* =========================================================
   7 SEGMENT DIGIT DEFINITIONS

   a = top
   b = upper right
   c = lower right
   d = bottom
   e = lower left
   f = upper left
   g = middle
========================================================= */

const segmentMap = {

    "0":
        ["a", "b", "c", "d", "e", "f"],

    "1":
        ["b", "c"],

    "2":
        ["a", "b", "g", "e", "d"],

    "3":
        ["a", "b", "c", "d", "g"],

    "4":
        ["f", "g", "b", "c"],

    "5":
        ["a", "f", "g", "c", "d"],

    "6":
        ["a", "f", "g", "e", "c", "d"],

    "7":
        ["a", "b", "c"],

    "8":
        ["a", "b", "c", "d", "e", "f", "g"],

    "9":
        ["a", "b", "c", "d", "f", "g"]

};


/* =========================================================
   GET ELEMENTS
========================================================= */

const meterButtons =
    document.getElementById(
        "meterButtons"
    );


const meterImage =
    document.getElementById(
        "meterImage"
    );


const meterArea =
    document.getElementById(
        "meterArea"
    );


const digitLayer =
    document.getElementById(
        "digitLayer"
    );


const readingInput =
    document.getElementById(
        "readingInput"
    );


const digitColor =
    document.getElementById(
        "digitColor"
    );


const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let digitGroup = null;

let scale = 1;

let currentX = 0;

let currentY = 0;


/* =========================================================
   CREATE METER 1 - 15 BUTTONS
========================================================= */

for (
    let i = 1;
    i <= 15;
    i++
) {


    const button =
        document.createElement(
            "button"
        );


    button.textContent =
        "Meter " + i;


    button.onclick = () => {


        if (!meterImages[i]) {

            status.textContent =
                "Meter " +
                i +
                " image is not configured yet.";

            return;
        }


        /*
           Image loaded
        */

        meterImage.onload =
            () => {

                status.textContent =
                    "Meter " +
                    i +
                    " loaded.";

                resetPosition();

            };


        /*
           Image error
        */

        meterImage.onerror =
            () => {

                status.textContent =
                    "Image not found: " +
                    meterImages[i];

            };


        /*
           Change image
        */

        meterImage.src =
            meterImages[i];

    };


    meterButtons.appendChild(
        button
    );

}


/* =========================================================
   LOAD FIRST METER
========================================================= */

meterImage.src =
    meterImages[1];


/* =========================================================
   CREATE ONE 7 SEGMENT DIGIT
========================================================= */

function makeDigit(number) {


    const digit =
        document.createElement(
            "div"
        );


    digit.className =
        "seven-digit";


    const activeSegments =
        segmentMap[number];


    /*
       Create all 7 segments
    */

    [
        "a",
        "b",
        "c",
        "d",
        "e",
        "f",
        "g"

    ].forEach(
        segmentName => {


            const segment =
                document.createElement(
                    "span"
                );


            segment.className =
                "seg " +
                segmentName;


            /*
               Turn segment ON
            */

            if (
                activeSegments.includes(
                    segmentName
                )
            ) {

                segment.classList.add(
                    "on"
                );

            }


            digit.appendChild(
                segment
            );

        }
    );


    return digit;

}


/* =========================================================
   CREATE COMPLETE READING
========================================================= */

function createDigits(value) {


    /*
       Remove old digits
    */

    digitLayer.innerHTML = "";

    digitGroup = null;


    /*
       Empty input
    */

    if (!value) {

        status.textContent =
            "Enter a reading first.";

        return;
    }


    /*
       Only numbers
    */

    if (!/^\d+$/.test(value)) {

        status.textContent =
            "Only numbers are allowed.";

        return;
    }


    /*
       Create group
    */

    digitGroup =
        document.createElement(
            "div"
        );


    digitGroup.className =
        "digit-group";


    /*
       Create every digit
    */

    [...value].forEach(
        number => {

            digitGroup.appendChild(
                makeDigit(number)
            );

        }
    );


    /*
       Add group to meter
    */

    digitLayer.appendChild(
        digitGroup
    );


    /*
       Default size
    */

    scale = 1;


    /*
       Apply color
    */

    setColor();


    /*
       Put in center
    */

    resetPosition();


    /*
       Enable mobile interaction
    */

    enableTouchDragAndPinch(
        digitGroup
    );


    status.textContent =
        "Reading " +
        value +
        " added.";

}


/* =========================================================
   RESET DIGIT POSITION
========================================================= */

function resetPosition() {


    if (!digitGroup) {

        return;
    }


    /*
       Center horizontally
    */

    currentX =
        (
            meterArea.clientWidth -
            digitGroup.offsetWidth
        ) / 2;


    /*
       Center vertically
    */

    currentY =
        (
            meterArea.clientHeight -
            digitGroup.offsetHeight
        ) / 2;


    apply();

}


/* =========================================================
   APPLY POSITION + SCALE
========================================================= */

function apply() {


    if (!digitGroup) {

        return;
    }


    digitGroup.style.left =
        currentX + "px";


    digitGroup.style.top =
        currentY + "px";


    digitGroup.style.transform =
        "scale(" +
        scale +
        ")";

}


/* =========================================================
   MOBILE + DESKTOP INTERACTION

   1 FINGER:
       Move digit

   2 FINGERS:
       Pinch to resize
========================================================= */
function enableTouchDragAndPinch(element) {

    let pointers = new Map();

    let startX = 0;
    let startY = 0;

    let originalX = 0;
    let originalY = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1;


    // =========================================
    // Calculate distance between two fingers
    // =========================================

    function getDistance() {

        const points = [...pointers.values()];

        if (points.length < 2) {
            return 0;
        }

        const x =
            points[0].x -
            points[1].x;

        const y =
            points[0].y -
            points[1].y;

        return Math.sqrt(
            x * x + y * y
        );
    }


    // =========================================
    // POINTER DOWN
    // =========================================

    element.addEventListener(
        "pointerdown",
        function (event) {

            event.preventDefault();

            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            // -------------------------------
            // ONE FINGER
            // -------------------------------

            if (pointers.size === 1) {

                startX =
                    event.clientX;

                startY =
                    event.clientY;

                originalX =
                    currentX;

                originalY =
                    currentY;

                element.classList.add(
                    "dragging"
                );
            }


            // -------------------------------
            // TWO FINGERS
            // -------------------------------

            if (pointers.size === 2) {

                pinchStartDistance =
                    getDistance();

                pinchStartScale =
                    scale;

                element.classList.remove(
                    "dragging"
                );
            }


            try {

                element.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {}

        }
    );


    // =========================================
    // POINTER MOVE
    // =========================================

    element.addEventListener(
        "pointermove",
        function (event) {

            if (
                !pointers.has(
                    event.pointerId
                )
            ) {

                return;
            }


            /*
             Update current finger position
            */

            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            // =================================
            // TWO FINGERS = PINCH ZOOM
            // =================================

            if (pointers.size === 2) {

                const currentDistance =
                    getDistance();


                if (
                    pinchStartDistance > 0
                ) {

                    const zoomRatio =
                        currentDistance /
                        pinchStartDistance;


                    scale =
                        pinchStartScale *
                        zoomRatio;


                    /*
                     Minimum size
                    */

                    if (scale < 0.3) {

                        scale = 0.3;

                    }


                    /*
                     Maximum size
                    */

                    if (scale > 4) {

                        scale = 4;

                    }


                    apply();

                }


                return;
            }


            // =================================
            // ONE FINGER = DRAG
            // =================================

            if (pointers.size === 1) {

                currentX =
                    originalX +
                    (
                        event.clientX -
                        startX
                    );


                currentY =
                    originalY +
                    (
                        event.clientY -
                        startY
                    );


                apply();

            }

        }
    );


    // =========================================
    // POINTER UP
    // =========================================

    function pointerEnd(event) {

        pointers.delete(
            event.pointerId
        );


        // -------------------------------
        // NO FINGER
        // -------------------------------

        if (pointers.size === 0) {

            element.classList.remove(
                "dragging"
            );

            pinchStartDistance = 0;

        }


        // -------------------------------
        // ONE FINGER LEFT
        // -------------------------------

        if (pointers.size === 1) {

            const remaining =
                [...pointers.values()][0];


            startX =
                remaining.x;

            startY =
                remaining.y;


            originalX =
                currentX;

            originalY =
                currentY;


            /*
             Next movement will again
             work as normal dragging
            */

        }


        try {

            element.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {}

    }


    // =========================================
    // POINTER UP
    // =========================================

    element.addEventListener(
        "pointerup",
        pointerEnd
    );


    // =========================================
    // POINTER CANCEL
    // =========================================

    element.addEventListener(
        "pointercancel",
        pointerEnd
    );

}


/* =========================================================
   DIGIT COLOR
========================================================= */

function setColor() {


    if (!digitGroup) {

        return;
    }


    digitGroup
        .querySelectorAll(
            ".seven-digit"
        )
        .forEach(
            digit => {


                digit.style.setProperty(
                    "--digit-color",
                    digitColor.value
                );

            }
        );

}


/* =========================================================
   UPDATE DIGIT BUTTON
========================================================= */

document
    .getElementById(
        "updateBtn"
    )
    .onclick =
    () => {


        createDigits(
            readingInput.value.trim()
        );

    };


/* =========================================================
   ENTER KEY
========================================================= */

readingInput.onkeydown =
    event => {


        if (
            event.key === "Enter"
        ) {


            createDigits(
                readingInput.value.trim()
            );

        }

    };


/* =========================================================
   A+ BUTTON
========================================================= */

document
    .getElementById(
        "plusBtn"
    )
    .onclick =
    () => {


        if (!digitGroup) {

            return;
        }


        scale =
            Math.min(
                4,
                scale + 0.1
            );


        apply();

    };


/* =========================================================
   A- BUTTON
========================================================= */

document
    .getElementById(
        "minusBtn"
    )
    .onclick =
    () => {


        if (!digitGroup) {

            return;
        }


        scale =
            Math.max(
                0.3,
                scale - 0.1
            );


        apply();

    };


/* =========================================================
   COLOR PICKER
========================================================= */

digitColor.oninput =
    setColor;


/* =========================================================
   RESET BUTTON
========================================================= */

document
    .getElementById(
        "resetBtn"
    )
    .onclick =
    () => {


        readingInput.value = "";


        digitLayer.innerHTML =
            "";


        digitGroup =
            null;


        scale =
            1;


        currentX =
            0;


        currentY =
            0;


        status.textContent =
            "Reset complete.";

    };


</script>

</body>

</html>
